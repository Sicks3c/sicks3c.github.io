name: Validate Hugo Site

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Required for Hugo themes
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.144.2'
          extended: true

      - name: Build
        run: |
          hugo \
            --minify \
            --gc \
            --panicOnWarning \
            -e production
